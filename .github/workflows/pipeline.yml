    #         - uses: subosito/flutter-action@v2
    #           with:
    #             channel: "stable"
    #         - run: flutter pub get
    #         - run: flutter analyze
    test-unit:
        name: Run Flutter unit test
        runs-on: ubuntu-latest
        #needs: [lint]
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-java@v1
              with:
                java-version: "12.x"
            - uses: subosito/flutter-action@v2
              with:
                channel: "stable"
            - name: Run tests for all packages
              run: |
                mkdir -p "$GITHUB_WORKSPACE/test-results"
                for dir in $GITHUB_WORKSPACE/packages/*; do
                if [ -d "$dir" ]; then
                    pkg=$(basename "$dir")
                    echo "🔍 Rodando testes em $pkg"
                    (cd "$dir" && flutter pub get)
                    flutter test --coverage --machine > "$GITHUB_WORKSPACE/test-results/${pkg}.json"
                fi
                done

            - name: Test reporter
              uses: dorny/test-reporter@v2
              if: ${{ !cancelled() }} 
              with:
                name: Flutter Tests
                path: test-results/*.json
                reporter: flutter-json


