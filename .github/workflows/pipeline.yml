name: CI/CD - POC

permissions:
    checks: write
    contents: read
    pull-requests: write

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    # lint:
    #     name: Run Flutter analyze
    #     runs-on: ubuntu-latest
